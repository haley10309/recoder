services:
  raw_auto_client:
    build:
      context: .
      dockerfile: Dockerfile_client
    image: raw_auto_client
    container_name: raw_auto_client
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8088:80"
    env_file:
      - .env
    restart: unless-stopped
